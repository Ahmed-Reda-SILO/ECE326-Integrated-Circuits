  </text>
  <text x="94" y="248" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#DCEBFA">
    CMOS Digital Design • Processing Technology • Physical Layout
  </text>

  <rect x="90" y="295" width="520" height="54" rx="27" fill="#FFFFFF" opacity="0.10"/>
  <text x="120" y="331" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">
    15 Lectures  •  499 Slides  •  Complete Course Repository
